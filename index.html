<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ramo de Lirios 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Poppins',sans-serif;

    background:
    radial-gradient(circle at top,#1e293b 0%,#0f172a 40%,#020617 100%);
}

/* Fondo */

.stars{
    position:absolute;
    inset:0;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    opacity:.7;
    animation:twinkle 3s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.2;}
    to{opacity:1;}
}

/* Tarjeta */

.card{
    position:relative;

    width:92vw;
    max-width:390px;

    height:92vh;
    max-height:760px;

    border-radius:30px;

    background:rgba(255,255,255,.05);

    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
    0 0 35px rgba(255,255,255,.08);

    overflow:hidden;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:28px 22px;
}

/* Titulo */

.title{
    color:white;
    font-size:2rem;
    font-weight:600;
    margin-top:10px;

    animation:fadeUp 1.5s ease;
}

.text{
    margin-top:14px;

    text-align:center;

    color:#e2e8f0;

    line-height:1.8;

    font-size:.97rem;

    width:100%;

    animation:fadeUp 2s ease;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ========================= */
/* RAMO */
/* ========================= */

.bouquet{
    position:relative;

    width:260px;
    height:340px;

    margin-top:20px;

    display:flex;
    justify-content:center;
    align-items:flex-end;
}

/* Papel del ramo */

.wrap{
    position:absolute;

    bottom:0;
    left:50%;

    transform:translateX(-50%);

    width:190px;
    height:150px;

    background:
    linear-gradient(
        135deg,
        #fbcfe8,
        #f9a8d4
    );

    clip-path:polygon(
        0 0,
        100% 0,
        78% 100%,
        22% 100%
    );

    z-index:1;

    opacity:.95;

    box-shadow:
    0 0 20px rgba(249,168,212,.3);
}

/* Moño */

.bow{
    position:absolute;

    bottom:72px;
    left:50%;

    transform:translateX(-50%);

    width:34px;
    height:34px;

    background:#ec4899;

    border-radius:50%;

    z-index:4;

    box-shadow:0 0 15px rgba(236,72,153,.5);
}

.bow::before,
.bow::after{
    content:"";

    position:absolute;

    width:38px;
    height:20px;

    background:#f472b6;

    border-radius:50px;
}

.bow::before{
    left:-28px;
    top:7px;
}

.bow::after{
    right:-28px;
    top:7px;
}

/* ========================= */
/* FLORES */
/* ========================= */

.flower{
    position:absolute;

    z-index:2;

    animation:sway 5s ease-in-out infinite;
}

@keyframes sway{
    0%{transform:rotate(-2deg);}
    50%{transform:rotate(2deg);}
    100%{transform:rotate(-2deg);}
}

/* Posiciones */

.f1{
    left:96px;
    bottom:125px;
    transform:scale(.82);
}

.f2{
    left:48px;
    bottom:95px;
    transform:scale(.75);
}

.f3{
    left:142px;
    bottom:95px;
    transform:scale(.75);
}

.f4{
    left:72px;
    bottom:65px;
    transform:scale(.7);
}

.f5{
    left:120px;
    bottom:65px;
    transform:scale(.7);
}

/* Tallo */

.stem{
    width:6px;
    height:110px;

    background:
    linear-gradient(#14532d,#22c55e);

    margin:auto;

    border-radius:20px;
}

/* Lirio */

.lily{
    position:relative;

    width:70px;
    height:70px;

    margin:auto;
    margin-bottom:-5px;
}

/* Petalos */

.petal{
    position:absolute;

    width:28px;
    height:55px;

    left:21px;
    top:8px;

    background:
    linear-gradient(
        180deg,
        #ffffff 0%,
        #ffe4f1 60%,
        #f9a8d4 100%
    );

    border-radius:50%;

    transform-origin:bottom center;

    box-shadow:
    0 0 10px rgba(255,255,255,.4);
}

.p1{transform:rotate(0deg);}
.p2{transform:rotate(60deg);}
.p3{transform:rotate(120deg);}
.p4{transform:rotate(180deg);}
.p5{transform:rotate(240deg);}
.p6{transform:rotate(300deg);}

/* Centro */

.center{
    position:absolute;

    width:12px;
    height:12px;

    background:#fde68a;

    border-radius:50%;

    top:29px;
    left:29px;

    box-shadow:0 0 12px #fde68a;
}

/* Hojas */

.leaf{
    position:absolute;

    width:24px;
    height:12px;

    background:#16a34a;

    border-radius:100px 0;
}

.leaf1{
    left:-13px;
    top:65px;

    transform:rotate(-35deg);
}

.leaf2{
    right:-13px;
    top:85px;

    transform:rotate(145deg);
}

/* Firma */

.footer{
    position:absolute;

    bottom:35px;

    left:50%;

    transform:translateX(-50%);

    color:#fbcfe8;

    text-align:center;

    font-size:.95rem;

    width:100%;
}

.name{
    color:white;
    font-weight:600;
}

/* Corazones */

.heart{
    position:absolute;

    color:#f9a8d4;

    animation:float linear forwards;

    opacity:.8;
}

@keyframes float{

    from{
        transform:translateY(100vh) scale(.5);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    to{
        transform:translateY(-120px) scale(1.2);
        opacity:0;
    }
}

</style>
</head>

<body>

<div class="stars"></div>

<div class="card">

    <div class="title">
        Para Ti 💖
    </div>

    <div class="text">
        Como los lirios, haces que todo se vea más bonito sin intentarlo.
        Gracias por existir y por convertir mis días en algo especial.
    </div>

    <div class="bouquet">

        <div class="wrap"></div>
        <div class="bow"></div>

        <!-- Flor 1 -->
        <div class="flower f1">

            <div class="lily">
                <div class="petal p1"></div>
                <div class="petal p2"></div>
                <div class="petal p3"></div>
                <div class="petal p4"></div>
                <div class="petal p5"></div>
                <div class="petal p6"></div>
                <div class="center"></div>
            </div>

            <div class="stem">
                <div class="leaf leaf1"></div>
                <div class="leaf leaf2"></div>
            </div>

        </div>

        <!-- Flor 2 -->
        <div class="flower f2">

            <div class="lily">
                <div class="petal p1"></div>
                <div class="petal p2"></div>
                <div class="petal p3"></div>
                <div class="petal p4"></div>
                <div class="petal p5"></div>
                <div class="petal p6"></div>
                <div class="center"></div>
            </div>

            <div class="stem">
                <div class="leaf leaf1"></div>
                <div class="leaf leaf2"></div>
            </div>

        </div>

        <!-- Flor 3 -->
        <div class="flower f3">

            <div class="lily">
                <div class="petal p1"></div>
                <div class="petal p2"></div>
                <div class="petal p3"></div>
                <div class="petal p4"></div>
                <div class="petal p5"></div>
                <div class="petal p6"></div>
                <div class="center"></div>
            </div>

            <div class="stem">
                <div class="leaf leaf1"></div>
                <div class="leaf leaf2"></div>
            </div>

        </div>

        <!-- Flor 4 -->
        <div class="flower f4">

            <div class="lily">
                <div class="petal p1"></div>
                <div class="petal p2"></div>
                <div class="petal p3"></div>
                <div class="petal p4"></div>
                <div class="petal p5"></div>
                <div class="petal p6"></div>
                <div class="center"></div>
            </div>

            <div class="stem">
                <div class="leaf leaf1"></div>
                <div class="leaf leaf2"></div>
            </div>

        </div>

        <!-- Flor 5 -->
        <div class="flower f5">

            <div class="lily">
                <div class="petal p1"></div>
                <div class="petal p2"></div>
                <div class="petal p3"></div>
                <div class="petal p4"></div>
                <div class="petal p5"></div>
                <div class="petal p6"></div>
                <div class="center"></div>
            </div>

            <div class="stem">
                <div class="leaf leaf1"></div>
                <div class="leaf leaf2"></div>
            </div>

        </div>

    </div>

    <div class="footer">
        Con amor: <span class="name">Antonio 💖</span>
    </div>

</div>

<script>

/* Estrellas */

const stars = document.querySelector('.stars');

for(let i=0;i<120;i++){

    const star = document.createElement('div');

    star.classList.add('star');

    star.style.left = Math.random()*100 + '%';
    star.style.top = Math.random()*100 + '%';

    star.style.animationDuration =
    (Math.random()*4 + 2) + 's';

    stars.appendChild(star);
}

/* Corazones */

function createHeart(){

    const heart = document.createElement('div');

    heart.classList.add('heart');

    heart.innerHTML = '❤';

    heart.style.left =
    Math.random()*100 + 'vw';

    heart.style.fontSize =
    (Math.random()*18 + 14) + 'px';

    heart.style.animationDuration =
    (Math.random()*3 + 4) + 's';

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },7000);
}

setInterval(createHeart,500);

</script>

</body>
</html>
